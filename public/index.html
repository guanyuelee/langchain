<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangChain 聊天机器人</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .chat-container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .chat-header {
      background-color: #4a6cf7;
      color: white;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: 600;
    }
    .chat-messages {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
    }
    .user-message {
      background-color: #4a6cf7;
      color: white;
      align-self: flex-end;
    }
    .bot-message {
      background-color: #e9ecef;
      color: #333;
      align-self: flex-start;
    }
    .chat-input {
      display: flex;
      padding: 20px;
      border-top: 1px solid #eee;
    }
    #userInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    #userInput:focus {
      border-color: #4a6cf7;
    }
    button {
      background-color: #4a6cf7;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      margin-left: 12px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #3a5ce7;
    }
    .loading {
      display: flex;
      align-items: center;
      color: #666;
    }
    .loading::after {
      content: '';
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4a6cf7;
      border-radius: 50%;
      margin-left: 10px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .chat-messages {
        height: 70vh;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">LangChain 聊天机器人</div>
    <div class="chat-messages" id="chatMessages">
      <!-- 消息将在这里显示 -->
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="输入消息..." autofocus>
      <button id="sendButton">▶</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script>
    // 连接Socket.IO服务器
    const socket = io();
    
    // DOM元素
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    
    // 加入会话
    socket.on('connect', () => {
      socket.emit('join');
    });
    
    // 显示机器人消息
    socket.on('bot_response', (message) => {
      appendMessage('bot', message);
      
      // 移除加载状态
      const loading = document.querySelector('.loading');
      if (loading) {
        loading.remove();
      }
    });
    
    // 发送消息函数
    function sendMessage() {
      const message = userInput.value.trim();
      if (message) {
        // 显示用户消息
        appendMessage('user', message);
        
        // 发送消息到服务器
        socket.emit('user_message', message);
        
        // 显示加载状态
        const loading = document.createElement('div');
        loading.className = 'loading message bot-message';
        loading.textContent = '思考中';
        chatMessages.appendChild(loading);
        
        // 清空输入框并滚动到底部
        userInput.value = '';
        scrollToBottom();
      }
    }
    
    // 添加消息到聊天界面
    function appendMessage(sender, message) {
      const messageElement = document.createElement('div');
      messageElement.className = `message ${sender}-message`;
      messageElement.textContent = message;
      chatMessages.appendChild(messageElement);
      scrollToBottom();
    }
    
    // 滚动到底部
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // 事件监听器
    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
    
    // 处理连接错误
    socket.on('connect_error', (error) => {
      console.error('连接错误:', error);
      appendMessage('bot', '连接服务器时出现错误，请刷新页面重试。');
    });
  </script>
</body>
</html>
